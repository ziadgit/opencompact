<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>OpenCompact</title>
  <style>.ink{fill:#EFE9E1}.m0{stop-color:#4A443D}.m1{stop-color:#1A1817}.us{stroke:#8EA0C9}</style>
  <defs>
    <linearGradient id="mirror" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="m0"/>
      <stop offset="1" class="m1"/>
    </linearGradient>
    <radialGradient id="pan" cx="40%" cy="35%" r="80%">
      <stop offset="0" stop-color="#E9D7AC"/>
      <stop offset="0.6" stop-color="#C9A86A"/>
      <stop offset="1" stop-color="#9C7C42"/>
    </radialGradient>
  </defs>
  <!-- open mirror lid -->
  <circle class="ink" cx="32" cy="21" r="15"/>
  <circle cx="32" cy="21" r="11.6" fill="url(#mirror)"/>
  <path d="M25.5 18 A7.5 7.5 0 0 1 30.5 13.8" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <!-- base with powder pan -->
  <ellipse class="ink" cx="32" cy="44" rx="22" ry="9"/>
  <ellipse cx="32" cy="42.6" rx="15" ry="5.2" fill="url(#pan)"/>
  <!-- verdict halo: US · California · EU -->
  <path d="M8.5 50.5 A26 9.5 0 0 0 21 57.6" class="us" fill="none" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M25.5 58.6 A26 9.5 0 0 0 38.5 58.6" fill="none" stroke="#D9572B" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M43 57.6 A26 9.5 0 0 0 55.5 50.5" fill="none" stroke="#2443A6" stroke-width="2.4" stroke-linecap="round"/>
</svg>
